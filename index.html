<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="そらごころ脳トレ - 記憶力・直感力・計算力・注意力を鍛えるミニゲーム集。毎日の脳トレにどうぞ。">
    <meta name="theme-color" content="#4A90E2">
    <meta property="og:title" content="☁️そらごころ脳トレ">
    <meta property="og:description" content="記憶力・直感力・計算力・注意力を鍛える脳トレミニゲーム集。今日の脳年齢を測定しよう！">
    <meta property="og:type" content="website">
    <title>そらごころ脳トレ</title>
    <style>
        :root { --primary: #4A90E2; --secondary: #F39C12; --bg: #EBF5FB; --text: #333; --card: #FFF; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; justify-content: center; min-height: 100vh; user-select: none; }
        select, input, textarea { user-select: text; -webkit-user-select: text; }
        #app { width: 100%; max-width: 480px; background: var(--card); box-shadow: 0 0 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        header { background: var(--primary); color: white; padding: 15px 10px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .content { padding: 20px; flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; }
        .screen { display: none; } .screen.active { display: flex; flex-direction: column; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        h2 { text-align: center; color: var(--primary); margin-top: 0; }
        input[type="text"] { width: 100%; padding: 12px; margin: 10px 0 20px; border: 2px solid var(--primary); border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        select { width:100%; padding:10px; font-size:16px; border-radius:8px; border:2px solid var(--primary); box-sizing:border-box; background:white; }
        button { background: var(--primary); color: white; border: none; padding: 15px; margin: 8px 0; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: transform 0.1s; width: 100%; }
        button:active { transform: scale(0.95); }
        .btn-sub { background: #95a5a6; } .btn-accent { background: var(--secondary); }
        .btn-daily { background: linear-gradient(45deg, #ff9a9e, #fecfef); color: #333; font-size: 18px; padding: 20px; border: 2px solid #ff758c; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .grid-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .cat-card { color: white; padding: 15px 10px; border-radius: 12px; text-align: center; font-weight: bold; cursor: pointer; transition: transform .15s, box-shadow .15s; }
        .cat-card:active { transform: scale(0.96); }
        .bg-memory { background: linear-gradient(135deg, #FF9A9E, #FECFEF); color: #333; }
        .bg-reflex { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }
        .bg-calc { background: linear-gradient(135deg, #84fab0, #8fd3f4); color: #333; }
        .bg-attention { background: linear-gradient(135deg, #fccb90, #d57eeb); }
        .game-list-item { background: #f0f8ff; border: 1px solid #cce5ff; padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; text-align: left; transition: background .15s; }
        .game-list-item:active { background: #dceeff; }
        #game-area { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 300px; background: #f9f9f9; border-radius: 10px; padding: 15px; margin-bottom: 15px; position: relative; text-align: center; transition: background-color .25s; touch-action: pan-y; }
        .top-bar { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        #g-bar { height: 6px; background: #ddd; border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
        #g-bar-fill { height: 100%; width: 100%; background: var(--secondary); transition: width 1s linear; }
        .ranking-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        .ranking-table th, .ranking-table td { padding: 8px; border-bottom: 1px solid #ddd; text-align: center; }
        .ranking-table th { background: var(--primary); color: white; }
        .rank-1 { color: #d4af37; font-weight: bold; font-size: 1.1em; } .rank-2 { color: #c0c0c0; font-weight: bold; } .rank-3 { color: #cd7f32; font-weight: bold; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; color: white; flex-direction: column; padding: 20px; box-sizing: border-box; }
        .age-result { font-size: 80px; font-weight: bold; color: #FFD700; text-shadow: 0 0 20px #FF8C00; animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(0.1); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        /* ゲーム特有UI */
        .board-4x4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; width: 100%; max-width: 300px; }
        .card { background: var(--primary); color: var(--primary); height: 60px; display: flex; justify-content: center; align-items: center; font-size: 24px; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .card.open { background: white; color: black; border: 2px solid var(--primary); }
        .seq-btn { height: 60px; font-size: 24px; border-radius: 5px; background: #ddd; display: flex; justify-content: center; align-items: center; transition: background .15s; }
        .seq-btn.lit { background: #f1c40f; box-shadow: 0 0 15px #f1c40f; }
    </style>
</head>
<body>

<div id="app">
    <header>
        <span id="h-user" onclick="app.editName()" style="cursor:pointer">👤 ゲスト</span>
        <span>☁️そらごころ脳トレ</span>
        <div>
            <span onclick="app.toggleBGM()" id="bgm-icon" style="cursor:pointer; margin-right:10px;">🔈</span>
            <span onclick="app.goHome()" style="cursor:pointer">🏠</span>
        </div>
    </header>

    <div class="content">
        <!-- ログイン -->
        <div id="screen-login" class="screen active">
            <h2>ようこそ！</h2>
            <p>日々のあそびの中で、楽しく脳を鍛えましょう。</p>
            <input type="text" id="username-input" placeholder="名前を入力">
            <button onclick="app.login()">はじめる</button>
        </div>

        <!-- ホーム -->
        <div id="screen-home" class="screen">
            <button class="btn-daily" onclick="app.startDaily()">✨ 今日の脳トレ（全4種連続）</button>
            <div class="grid-2x2" style="margin-top:15px;">
                <button class="btn-sub" onclick="app.showScreen('mypage')">📈 マイページ</button>
                <button class="btn-sub" onclick="app.showScreen('global-ranking')">🏆 総合ランキング</button>
            </div>
            <h3 style="margin-top:20px;">自由にえらぶ</h3>
            <div class="grid-2x2">
                <div class="cat-card bg-memory" onclick="app.showCategory('memory')">🧠<br>記憶力系</div>
                <div class="cat-card bg-reflex" onclick="app.showCategory('reflex')">⚡<br>直感力・判断力系</div>
                <div class="cat-card bg-calc" onclick="app.showCategory('calc')">🧮<br>計算力系</div>
                <div class="cat-card bg-attention" onclick="app.showCategory('attention')">👀<br>注意力・空間系</div>
            </div>
        </div>

        <!-- ゲーム一覧 -->
        <div id="screen-list" class="screen">
            <h2 id="list-title">カテゴリ</h2>
            <div id="list-container"></div>
            <button class="btn-sub" onclick="app.goHome()">戻る</button>
        </div>

        <!-- プレイ画面 -->
        <div id="screen-game" class="screen">
            <h3 id="game-title" style="text-align:center; margin:0 0 10px 0;">ゲーム名</h3>
            <div class="top-bar"><span id="g-timer">⏳ --</span><span id="g-score">🏆 0</span></div>
            <div id="g-bar"><div id="g-bar-fill"></div></div>
            <div id="game-area"></div>
            <button class="btn-sub" id="btn-quit" onclick="app.quitGame()">やめる</button>
        </div>

        <!-- 結果 -->
        <div id="screen-result" class="screen">
            <h2>結果発表</h2>
            <p style="text-align:center; font-size:28px; font-weight:bold;" id="res-score">0</p>
            <div id="res-ranking-area">
                <h3 style="text-align:center; margin-top:20px;">🏆 今月のランキング</h3>
                <table class="ranking-table"><thead><tr><th>順位</th><th>名前</th><th>スコア</th></tr></thead><tbody id="res-ranking-body"></tbody></table>
            </div>
            <button onclick="app.retryGame()" id="btn-retry" style="margin-top:20px;">もう一度</button>
            <button class="btn-sub" onclick="app.goHome()">ホーム</button>
        </div>

        <!-- 総合ランキング -->
        <div id="screen-global-ranking" class="screen">
            <h2>総合ランキング</h2>
            <select id="rank-select" style="margin-bottom:10px;" onchange="app.loadGlobalRanking()">
                <option value="">ゲームを選んでください</option>
                <!-- JSで追加 -->
            </select>
            <table class="ranking-table"><thead><tr><th>順位</th><th>名前</th><th>スコア</th></tr></thead><tbody id="global-ranking-body"><tr><td colspan="3">選択してください</td></tr></tbody></table>
            <button class="btn-sub" style="margin-top:20px;" onclick="app.goHome()">戻る</button>
        </div>

        <!-- マイページ -->
        <div id="screen-mypage" class="screen">
            <h2>マイページ</h2>
            <p style="text-align:center">過去の「今日の脳トレ」の記録です。</p>
            <table class="ranking-table" style="margin-bottom:20px;"><thead><tr><th>日付</th><th>脳年齢</th></tr></thead><tbody id="mypage-body"></tbody></table>
            <button class="btn-sub" onclick="app.goHome()">戻る</button>
        </div>
    </div>

    <!-- 脳年齢発表モーダル -->
    <div id="modal-age" class="modal">
        <h3>測定完了！あなたの今日の脳年齢は…</h3>
        <div class="age-result" id="age-num">20歳</div>
        <button style="width:200px; margin-top:30px; background:white; color:var(--primary);" onclick="document.getElementById('modal-age').style.display='none'; app.goHome();">とじる</button>
    </div>

    <!-- 汎用お知らせモーダル（alert代替：埋め込み先で使っても安全） -->
    <div id="modal-info" class="modal">
        <h3 id="info-title"></h3>
        <p id="info-msg" style="max-width:320px; text-align:center; white-space:pre-line; line-height:1.6;"></p>
        <button id="info-ok" style="width:200px; margin-top:20px; background:white; color:var(--primary);">OK</button>
    </div>

    <!-- 汎用入力モーダル（prompt代替：埋め込み先で使っても安全） -->
    <div id="modal-prompt" class="modal">
        <h3 id="prompt-title"></h3>
        <input type="text" id="prompt-input" style="width:80%; max-width:280px;">
        <div style="display:flex; gap:10px; margin-top:20px; width:80%; max-width:280px;">
            <button id="prompt-cancel" class="btn-sub">キャンセル</button>
            <button id="prompt-ok" style="background:white; color:var(--primary);">OK</button>
        </div>
    </div>
</div>

<script>
/* =========================================
   設定・通信周り
========================================= */
const GAS_URL = "https://script.google.com/macros/s/AKfycbwjuZEq2wZ8UsFOOwubo-Dfs4LJYr_RWnsjLnntH7d9fqa4oCrxgB1ByGn9buP3RwZKig/exec";

const CATS = { memory:'記憶力系', reflex:'直感力・判断力系', calc:'計算力系', attention:'注意力・空間認識系' };

/* =========================================
   ユーティリティ
========================================= */
function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// localStorageが使えない環境（プライベートブラウズ等）でも落ちないようにする
const ls = {
    get: (k, d=null) => { try { const v = localStorage.getItem(k); return v===null ? d : v; } catch(e) { return d; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} }
};

/* =========================================
   音声（Web Audio API）※ユーザー操作まで生成を遅らせる
========================================= */
let audioCtx = null;
function getCtx() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch(e) { audioCtx = null; }
    }
    return audioCtx;
}
let bgmInterval = null;
let bgmOn = false;

const SE = {
    init: () => { const c = getCtx(); if (c && c.state === 'suspended') c.resume().catch(()=>{}); },
    tone: (freq, type, dur, vol=0.1) => {
        if (!bgmOn) return;
        const c = getCtx(); if (!c) return;
        try {
            const osc = c.createOscillator(); const gain = c.createGain();
            osc.type = type; osc.frequency.value = freq;
            osc.connect(gain); gain.connect(c.destination);
            gain.gain.setValueAtTime(vol, c.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
            osc.start(); osc.stop(c.currentTime + dur);
        } catch(e) {}
    },
    click: () => SE.tone(600, 'sine', 0.1),
    correct: () => { SE.tone(800, 'sine', 0.1); setTimeout(()=>SE.tone(1200, 'sine', 0.15), 100); },
    wrong: () => SE.tone(300, 'sawtooth', 0.3, 0.2),
    finish: () => { SE.tone(500, 'square', 0.1); setTimeout(()=>SE.tone(700, 'square', 0.3), 150); }
};

function startBGM() {
    if (!bgmOn) return; stopBGM();
    const c = getCtx(); if (!c) return;
    const notes = [261.63, 329.63, 392.00, 523.25]; // C E G C
    let step = 0;
    bgmInterval = setInterval(() => { SE.tone(notes[step % notes.length], 'triangle', 0.2, 0.03); step++; }, 500);
}
function stopBGM() { clearInterval(bgmInterval); }

/* =========================================
   ゲームデータ（全32種／各カテゴリ8種）
========================================= */
const GAMES = {
    // ---- 記憶力系 ----
    m1: { cat:'memory', id:'m1', title:'昨日、何食べた？', desc:'日記を覚えて質問に答えよう', unit:'点',
        play: (e) => {
            const f = ['🍎', '🍜', '🍛', '🍣', '🍔', '🥗']; const d = ['月', '火', '水'];
            const foods = {};
            d.forEach(x => { foods[x] = f[Math.floor(Math.random()*f.length)]; });
            const td = d[Math.floor(Math.random()*d.length)]; const tf = foods[td];
            e.html(`<p>3日間の食事を覚えて！(3秒)</p><table border="1" width="100%" style="font-size:24px; text-align:center">${d.map(x=>`<tr><td>${x}曜</td><td>${foods[x]}</td></tr>`).join('')}</table>`);
            setTimeout(() => {
                let opt = [...f].sort(()=>0.5-Math.random()).slice(0,4); if(!opt.includes(tf)) {opt[0]=tf; opt.sort(()=>0.5-Math.random());}
                e.html(`<p><b>${td}曜</b>に食べたのは？</p><div class="grid-2x2">${opt.map(o=>`<button style="font-size:30px" onclick="app.ans(${o===tf})">${o}</button>`).join('')}</div>`);
            }, 3000);
        }
    },
    m2: { cat:'memory', id:'m2', title:'順番通りにタップ', desc:'光った順番を覚えて押そう', unit:'コンボ',
        state: { seq:[], step:0, level:1 },
        play: (e) => {
            let s = GAMES.m2.state; s.seq = []; s.level = 1;
            const nextLevel = () => {
                s.step = 0; s.seq.push(Math.floor(Math.random()*4));
                e.html(`<p>レベル ${s.level}</p><div class="grid-2x2">${[0,1,2,3].map(i=>`<div id="btn-${i}" class="seq-btn" onclick="app.ans('m2',${i})"></div>`).join('')}</div>`);
                let delay = 500;
                s.seq.forEach((btnIdx, i) => {
                    setTimeout(() => {
                        const b = document.getElementById(`btn-${btnIdx}`);
                        if(b) { b.classList.add('lit'); SE.click(); setTimeout(()=>b.classList.remove('lit'), 300); }
                    }, delay + (i * 600));
                });
            };
            e.customAns = (val) => {
                if(val === s.seq[s.step]) { s.step++; SE.click(); if(s.step === s.seq.length) { s.level++; app.addScore(1); setTimeout(nextLevel, 1000); } }
                else { app.endGame(); }
            };
            nextLevel();
        }
    },
    m3: { cat:'memory', id:'m3', title:'そらごころ神経衰弱', desc:'同じ絵柄を揃えよう', unit:'点',
        state: { cards:[], openIdx:-1, pairs:0, lock:false },
        play: (e) => {
            const icons = ['☀️','☁️','☂️','⛄','⚡','🌪️','🌸','🍁'];
            let s = GAMES.m3.state; s.pairs = 0; s.openIdx = -1; s.lock = false;
            let deck = [...icons.slice(0,8), ...icons.slice(0,8)].sort(()=>0.5-Math.random());
            s.cards = deck;
            const render = () => e.html(`<div class="board-4x4">${deck.map((_,i)=>`<div class="card" id="c-${i}" onclick="app.ans('m3',${i})">❓</div>`).join('')}</div>`);
            render();
            e.customAns = (i) => {
                if(s.lock || document.getElementById(`c-${i}`).innerText !== '❓') return;
                SE.click(); const el = document.getElementById(`c-${i}`); el.innerText = s.cards[i]; el.classList.add('open');
                if(s.openIdx === -1) { s.openIdx = i; }
                else {
                    if(s.cards[s.openIdx] === s.cards[i]) { s.pairs++; app.addScore(10); s.openIdx = -1; SE.correct(); if(s.pairs===8) app.endGame(); }
                    else {
                        s.lock = true; SE.wrong();
                        setTimeout(() => { document.getElementById(`c-${s.openIdx}`).innerText='❓'; document.getElementById(`c-${s.openIdx}`).classList.remove('open'); el.innerText='❓'; el.classList.remove('open'); s.openIdx=-1; s.lock=false; }, 800);
                    }
                }
            };
        }
    },
    m4: { cat:'memory', id:'m4', title:'まばたきワード', desc:'一瞬だけ表示されることばを当てよう', unit:'点',
        play: (e) => {
            const words = ['あそび', 'ことば', 'ともだち', 'からだ', 'こころ', 'えがお', 'そら', 'きずな'];
            const target = words[Math.floor(Math.random()*words.length)];
            e.html(`<p>よく見て！</p><div style="font-size:40px; font-weight:bold; margin:30px 0;">3</div>`);
            setTimeout(()=>e.html(`<div style="font-size:40px; font-weight:bold; margin:30px 0;">2</div>`), 500);
            setTimeout(()=>e.html(`<div style="font-size:40px; font-weight:bold; margin:30px 0;">1</div>`), 1000);
            setTimeout(()=>e.html(`<div style="font-size:40px; font-weight:bold; margin:30px 0;">${target}</div>`), 1500);
            setTimeout(() => {
                let opt = [...words].sort(()=>0.5-Math.random()).slice(0,4); if(!opt.includes(target)) {opt[0]=target; opt.sort(()=>0.5-Math.random());}
                e.html(`<p>いまの「ことば」は？</p><div class="grid-2x2">${opt.map(o=>`<button style="font-size:24px" onclick="app.ans(${o===target})">${o}</button>`).join('')}</div>`);
            }, 1800);
        }
    },
    m5: { cat:'memory', id:'m5', title:'顔と名前記憶', desc:'3人の名前を覚えよう', unit:'点',
        play: (e) => {
            const faces = ['😀','😎','🥸','🧑‍🦰','👩‍🦱','🧔','👵','👴'].sort(()=>0.5-Math.random()).slice(0,3);
            const names = ['たろう','はなこ','けんじ','みどり','ゆうき','さくら','いちろう','なな'].sort(()=>0.5-Math.random()).slice(0,3);
            e.html(`<p>3人の名前を覚えて！(3秒)</p>${faces.map((f,i)=>`<div style="font-size:26px;margin:8px;">${f} ： ${names[i]}</div>`).join('')}`);
            setTimeout(() => {
                const qi = Math.floor(Math.random()*3);
                let opt = [...names].sort(()=>0.5-Math.random()).slice(0,4); if(!opt.includes(names[qi])) {opt[0]=names[qi]; opt.sort(()=>0.5-Math.random());}
                e.html(`<p>この人の名前は？</p><div style="font-size:50px;margin:10px;">${faces[qi]}</div><div class="grid-2x2">${opt.map(o=>`<button onclick="app.ans(${o===names[qi]})">${o}</button>`).join('')}</div>`);
            }, 3000);
        }
    },
    m6: { cat:'memory', id:'m6', title:'さかさま数字', desc:'数字を覚えて逆から並べよう', unit:'点',
        play: (e) => {
            const digits = Array.from({length:4}, ()=>Math.floor(Math.random()*9)+1);
            const seq = digits.join(''); const rev = [...digits].reverse().join('');
            e.html(`<p>数字を覚えて！(2.5秒)</p><div style="font-size:44px;font-weight:bold;letter-spacing:8px;">${seq}</div>`);
            setTimeout(() => {
                let opt = new Set([rev, seq]);
                while(opt.size < 4) opt.add(Array.from({length:4},()=>Math.floor(Math.random()*9)+1).join(''));
                let arr = [...opt].sort(()=>0.5-Math.random());
                e.html(`<p>逆から並べると？</p><div class="grid-2x2">${arr.map(o=>`<button style="font-size:22px" onclick="app.ans(${o===rev})">${o}</button>`).join('')}</div>`);
            }, 2500);
        }
    },
    m7: { cat:'memory', id:'m7', title:'買い物リスト', desc:'覚えた品物に無いものは？', unit:'点',
        play: (e) => {
            const items = ['🥛','🍞','🥚','🧀','🍅','🥕','🍌','🧻','🧴','🍪'].sort(()=>0.5-Math.random());
            const list = items.slice(0,4); const fake = items[4];

            const count = Math.floor(Math.random()*5)+3;
            let cells = Array.from({length:16}, ()=>shapes[Math.floor(Math.random()*shapes.length)]);
            cells = cells.map(c=>c===target?shapes[(shapes.indexOf(target)+1)%shapes.length]:c);
            for(let i=0;i<count;i++) cells[i]=target;
            cells.sort(()=>0.5-Math.random());
            let opt = [...new Set([count, count+1, Math.max(1,count-1), count+2])].sort(()=>0.5-Math.random());
            e.html(`<p>「${target}」はいくつある？</p><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:260px;font-size:26px;">${cells.map(c=>`<div>${c}</div>`).join('')}</div><div class="grid-2x2" style="margin-top:15px">${opt.map(o=>`<button onclick="app.ans(${o===count})">${o}個</button>`).join('')}</div>`);
        }
    },
    a8: { cat:'attention', id:'a8', title:'左右対称チェック', desc:'左右対称な形か見分けよう', unit:'点',
        play: (e) => {
            const symTargets=[['⬛','⬛','⬛','⬛','⬛'],['🟦','🟩','⚪','🟩','🟦'],['🔺','🔵','⬜','🔵','🔺']];
            const asymTargets=[['🟦','🟩','⚪','🟨','🟥'],['🔺','🔵','⬜','🟢','🔺'],['⬛','⬜','⬛','⬛','⬛']];
            const isSym = Math.random()>0.5;
            const row = isSym ? symTargets[Math.floor(Math.random()*symTargets.length)] : asymTargets[Math.floor(Math.random()*asymTargets.length)];
            e.html(`<p>これは左右対称？</p><div style="font-size:34px;letter-spacing:4px;margin:20px;">${row.join('')}</div><div class="grid-2x2" style="grid-template-columns:1fr 1fr;"><button onclick="app.ans(${isSym===true})">対称 ✅</button><button onclick="app.ans(${isSym===false})">非対称 ❌</button></div>`);
        }
    }
};

/* =========================================
   アプリケーションロジック
========================================= */
const app = {
    user: 'ゲスト', curG: null, curE: null, score: 0, time: 0, timeMax: 0, tid: null,
    state: 'menu', dailyMode: false, dailyGames: [], dailyStep: 0, dailyScore: 0,
    answering: false, _pollTimer: null,

    init() {
        this.buildSelect(); // 通信・音の前に、まずはリストを確実に作る
        bgmOn = ls.get('sora_bgm') === '1';
        document.getElementById('bgm-icon').innerText = bgmOn ? '🔊' : '🔈';
        this.attachSwipe();
        let name = ls.get('sora_user');
        if(name) { this.user = name; document.getElementById('h-user').innerText = `👤 ${this.user}`; this.showScreen('home'); }
    },
    login() {
        const n = document.getElementById('username-input').value.trim();
        if(n) { this.user = n; ls.set('sora_user', n); document.getElementById('h-user').innerText = `👤 ${this.user}`; this.showScreen('home'); }
    },
    editName() {
        this.showPrompt('新しい名前を入力してください', this.user, (n) => {
            this.user = n; ls.set('sora_user', this.user);
            document.getElementById('h-user').innerText = `👤 ${this.user}`;
        });
    },
    toggleBGM() {
        SE.init();
        bgmOn = !bgmOn; ls.set('sora_bgm', bgmOn ? '1' : '0');
        document.getElementById('bgm-icon').innerText = bgmOn ? '🔊' : '🔈';
        if(bgmOn && this.state === 'playing') startBGM(); else stopBGM();
    },
    showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(`screen-${id}`).classList.add('active');
        this.stopRankingPoll();
        if(id === 'global-ranking') { this.loadGlobalRanking(); this.startRankingPoll(() => this.loadGlobalRanking(true)); }
        if(id === 'mypage') this.loadMyPage();
    },
    goHome() { this.quitGame(); this.showScreen('home'); },

    // ---- ゲームフロー ----
    showCategory(c) {
        document.getElementById('list-title').innerText = CATS[c];
        const con = document.getElementById('list-container'); con.innerHTML = '';
        Object.values(GAMES).filter(g=>g.cat===c).forEach(g => {
            const d = document.createElement('div'); d.className = 'game-list-item';
            d.innerHTML = `<div style="font-weight:bold;font-size:18px">${g.title}</div><div style="font-size:12px;color:#666">${g.desc}</div>`;
            d.onclick = () => { this.dailyMode = false; this.startGame(g); };
            con.appendChild(d);
        });
        this.showScreen('list');
    },
    startGame(g) {
        SE.init(); // ユーザーがボタンを押したこの瞬間に音の準備をする
        this.curG = g; this.score = 0; this.time = (g.id==='a3'||g.id==='m3') ? 60 : 30; this.timeMax = this.time; this.state = 'playing';
        document.getElementById('game-title').innerText = g.title;
        document.getElementById('btn-quit').style.display = this.dailyMode ? 'none' : 'block';
        this.updateUI(); this.showScreen('game');
        startBGM();
        this.tid = setInterval(() => { this.time--; this.updateUI(); if(this.time<=0) this.endGame(); }, 1000);
        this.next();
    },
    updateUI() {
        document.getElementById('g-timer').innerText = `⏳ ${this.time}秒`;
        document.getElementById('g-score').innerText = `🏆 ${this.score}${this.curG.unit}`;
        const fill = document.getElementById('g-bar-fill');
        if(fill) fill.style.width = Math.max(0, this.timeMax ? (this.time/this.timeMax*100) : 100) + '%';
    },
    next() {
        if(this.state !== 'playing') return;
        this.answering = false;
        const e = { html: (h) => { const el = document.getElementById('game-area'); if(el) el.innerHTML = h; } };
        this.curE = e;
        this.curG.play(e);
    },
    // 修正: 以前は customAns 経路が毎回 play() を再実行して例外を投げ、
    // m2/m3/a3/r4 でタップが一切反応しなくなる致命的なバグがあったため書き直し
    ans(arg1, arg2) {
        if(this.state !== 'playing') return;
        if(typeof arg1 === 'string') {
            if(this.curE && typeof this.curE.customAns === 'function') this.curE.customAns(arg2);
            return;
        }
        if(this.answering) return; // 連打で二重加点しないようにロック
        this.answering = true;
        const area = document.getElementById('game-area');
        if(arg1===true) { this.score+=10; SE.correct(); if(area) area.style.background='#d4edda'; }
        else { SE.wrong(); if(area) area.style.background='#f8d7da'; }
        this.updateUI();
        setTimeout(() => { if(area) area.style.background='#f9f9f9'; this.answering=false; this.next(); }, 300);
    },
    addScore(v) { this.score += v; this.updateUI(); },
    endGame() {
        clearInterval(this.tid); this.state = 'ended'; stopBGM(); SE.finish();

        if(this.dailyMode) {
            this.dailyScore += this.score; this.dailyStep++;
            if(this.dailyStep < 4) { this.startGame(this.dailyGames[this.dailyStep]); }
            else { this.showAgeResult(); }
            return;
        }

        const g = this.curG, sc = this.score;
        document.getElementById('res-score').innerText = `${sc} ${g.unit}`;
        document.getElementById('btn-retry').style.display = 'block';
        document.getElementById('res-ranking-area').style.display = 'block';
        this.showScreen('result');
        this.saveAndLoad(g, sc, 'res-ranking-body');
        // 他の端末からの投稿もリアルタイムに近い形で反映されるように定期更新
        this.startRankingPoll(() => this.fetchRanking(g, 'res-ranking-body', sc, true));
    },
    quitGame() { clearInterval(this.tid); this.state = 'menu'; stopBGM(); this.stopRankingPoll(); },
    retryGame() { this.startGame(this.curG); },

    // ---- 今日の脳トレモード ----
    startDaily() {
        this.dailyMode = true; this.dailyStep = 0; this.dailyScore = 0;
        const cats = ['memory', 'reflex', 'calc', 'attention'];
        this.dailyGames = cats.map(c => {
            const arr = Object.values(GAMES).filter(g=>g.cat===c);
            return arr[Math.floor(Math.random()*arr.length)];
        });
        this.showInfo('今日の脳トレ', '全4カテゴリのミニゲームを連続でプレイします。\n最後に「脳年齢」が発表されます！', () => {
            this.startGame(this.dailyGames[0]);
        });
    },
    showAgeResult() {
        let age = Math.max(20, 80 - Math.floor(this.dailyScore / 5));
        document.getElementById('age-num').innerText = `${age}歳`;
        document.getElementById('modal-age').style.display = 'flex';
        SE.finish();

        let hist = [];
        try { hist = JSON.parse(ls.get('sora_history') || '[]'); } catch(e) { hist = []; }
        const today = new Date().toLocaleDateString('ja-JP');
        hist.unshift({ date: today, age: age });
        if(hist.length > 30) hist.pop();
        ls.set('sora_history', JSON.stringify(hist));
    },
    loadMyPage() {
        let hist = [];
        try { hist = JSON.parse(ls.get('sora_history') || '[]'); } catch(e) { hist = []; }
        const tbody = document.getElementById('mypage-body');
        if(hist.length===0) { tbody.innerHTML = '<tr><td colspan="2">まだ記録がありません</td></tr>'; return; }
        tbody.innerHTML = hist.map(h => `<tr><td>${escapeHtml(h.date)}</td><td style="font-weight:bold;color:var(--primary)">${escapeHtml(String(h.age))}歳</td></tr>`).join('');
    },

    // ---- スワイプ操作 ----
    attachSwipe() {
        const area = document.getElementById('game-area');
        let sx=0, sy=0, st=0;
        area.addEventListener('touchstart', (ev) => { const t=ev.changedTouches[0]; sx=t.clientX; sy=t.clientY; st=Date.now(); }, {passive:true});
        area.addEventListener('touchend', (ev) => {
            const t=ev.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy; const dt=Date.now()-st;
            if(dt>800) return;
            const absX=Math.abs(dx), absY=Math.abs(dy);
            if(Math.max(absX,absY) < 40) return;
            const dir = absX>absY ? (dx>0?'RIGHT':'LEFT') : (dy>0?'DOWN':'UP');
            if(this.state==='playing' && this.curG && typeof this.curG.onSwipe === 'function') this.curG.onSwipe(dir);
        }, {passive:true});
    },

    // ---- 汎用モーダル（alert/prompt代替。埋め込み・iframe環境でも安全に動く） ----
    showInfo(title, msg, onOk) {
        document.getElementById('info-title').innerText = title;
        document.getElementById('info-msg').innerText = msg;
        const modal = document.getElementById('modal-info'); modal.style.display = 'flex';
        const btn = document.getElementById('info-ok');
        const handler = () => { modal.style.display='none'; btn.removeEventListener('click', handler); if(onOk) onOk(); };
        btn.addEventListener('click', handler);
    },
    showPrompt(title, defVal, onOk) {
        document.getElementById('prompt-title').innerText = title;
        const input = document.getElementById('prompt-input'); input.value = defVal || '';
        const modal = document.getElementById('modal-prompt'); modal.style.display = 'flex';
        setTimeout(()=>input.focus(), 50);
        const okBtn = document.getElementById('prompt-ok'), cancelBtn = document.getElementById('prompt-cancel');
        const cleanup = () => { modal.style.display='none'; okBtn.removeEventListener('click', okHandler); cancelBtn.removeEventListener('click', cancelHandler); };
        const okHandler = () => { const v = input.value.trim(); cleanup(); if(v) onOk(v); };
        const cancelHandler = () => cleanup();
        okBtn.addEventListener('click', okHandler);
        cancelBtn.addEventListener('click', cancelHandler);
    },

    // ---- 通信・ランキング ----
    buildSelect() {
        const sel = document.getElementById('rank-select');
        let html = '<option value="">ゲームを選んでください</option>';
        Object.keys(CATS).forEach(catKey => {
            html += `<optgroup label="${CATS[catKey]}">`;
            Object.values(GAMES).filter(g=>g.cat===catKey).forEach(g => {
                html += `<option value="${CATS[catKey]}：${g.title}">${g.title}</option>`;
            });
            html += '</optgroup>';
        });
        sel.innerHTML = html;
    },
    titleFor(gameInfo) { return gameInfo.title_full || `${CATS[gameInfo.cat]}：${gameInfo.title}`; },
    loadGlobalRanking(silent=false) {
        const title = document.getElementById('rank-select').value;
        if(!title) { document.getElementById('global-ranking-body').innerHTML = '<tr><td colspan="3">選択してください</td></tr>'; return; }
        this.fetchRanking({title_full:title}, 'global-ranking-body', 0, silent);
    },
    async postScore(gameInfo, score) {
        if(!GAS_URL || GAS_URL.indexOf('script') === -1 || score <= 0) return;
        try { await fetch(`${GAS_URL}?action=save&gameTitle=${encodeURIComponent(this.titleFor(gameInfo))}&name=${encodeURIComponent(this.user)}&score=${score}`, {mode:'no-cors'}); }
        catch(e) {}
    },
    async fetchRanking(gameInfo, tbodyId, highlightScore=0, silent=false) {
        const tbody = document.getElementById(tbodyId); if(!tbody) return;
        if(!GAS_URL || GAS_URL.indexOf('script') === -1) { tbody.innerHTML = '<tr><td colspan="3">※ GAS連携待ち</td></tr>'; return; }
        if(!silent) tbody.innerHTML = '<tr><td colspan="3">通信中...</td></tr>';
        try {
            const res = await fetch(`${GAS_URL}?action=ranking&gameTitle=${encodeURIComponent(this.titleFor(gameInfo))}&t=${Date.now()}`);
            const ranks = await res.json();
            if(!Array.isArray(ranks) || ranks.length===0) { tbody.innerHTML = '<tr><td colspan="3">記録なし</td></tr>'; return; }
            tbody.innerHTML = ranks.map((r, i) => {
                const rc = i<3?`rank-${i+1}`:'';
                const hi = (highlightScore>0 && r.name===this.user && r.score===highlightScore) ? 'background:#fff3cd;font-weight:bold' : '';
                // 他ユーザーの名前はサーバー由来の値なので必ずエスケープしてXSSを防ぐ
                return `<tr style="${hi}"><td class="${rc}">${i+1}位</td><td>${escapeHtml(r.name)}</td><td class="${rc}">${escapeHtml(String(r.score))}</td></tr>`;
            }).join('');
        } catch(e) { if(!silent) tbody.innerHTML = '<tr><td colspan="3">通信エラー</td></tr>'; }
    },
    async saveAndLoad(gameInfo, score, tbodyId) {
        if(score > 0) { await this.postScore(gameInfo, score); await new Promise(r=>setTimeout(r, 900)); }
        await this.fetchRanking(gameInfo, tbodyId, score);
    },
    startRankingPoll(fn) { this.stopRankingPoll(); this._pollTimer = setInterval(fn, 6000); },
    stopRankingPoll() { if(this._pollTimer) { clearInterval(this._pollTimer); this._pollTimer = null; } }
};

window.onload = () => app.init();
</script>
